<?xml version="1.0" encoding="UTF-8"?>
<!-- Visuel d'attente DIYA : évocation d'un tapis (médaillon central, double
     bordure fine or sur fond ivoire) affiché tant que la photographie
     de la pièce n'est pas disponible. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
    <!-- Fond ivoire -->
    <rect width="600" height="800" fill="#f4eddb"/>

    <!-- Double bordure du tapis -->
    <rect x="36" y="36" width="528" height="728" fill="none" stroke="#b8944d" stroke-width="2"/>
    <rect x="52" y="52" width="496" height="696" fill="none" stroke="#b8944d" stroke-width="0.8"/>

    <!-- Frise géométrique de bordure (petits losanges) -->
    <g fill="none" stroke="#c9ab6e" stroke-width="0.8">
        <path d="M70 70 L300 62 L530 70 L538 400 L530 730 L300 738 L70 730 L62 400 Z"/>
    </g>

    <!-- Champ intérieur -->
    <rect x="86" y="86" width="428" height="628" fill="#efe5cc" stroke="#c9ab6e" stroke-width="0.6"/>

    <!-- Écoinçons (quarts de médaillon aux angles) -->
    <g fill="none" stroke="#b8944d" stroke-width="1">
        <path d="M86 200 Q 200 200 200 86"/>
        <path d="M514 200 Q 400 200 400 86"/>
        <path d="M86 600 Q 200 600 200 714"/>
        <path d="M514 600 Q 400 600 400 714"/>
    </g>

    <!-- Médaillon central : losange et rosace stylisés -->
    <g fill="none" stroke="#b8944d">
        <path d="M300 250 L440 400 L300 550 L160 400 Z" stroke-width="1.4"/>
        <path d="M300 285 L405 400 L300 515 L195 400 Z" stroke-width="0.8"/>
        <circle cx="300" cy="400" r="52" stroke-width="1.2"/>
        <circle cx="300" cy="400" r="30" stroke-width="0.7"/>
        <!-- Pétales de la rosace -->
        <path d="M300 348 Q 312 380 300 400 Q 288 380 300 348" stroke-width="0.7"/>
        <path d="M300 452 Q 312 420 300 400 Q 288 420 300 452" stroke-width="0.7"/>
        <path d="M248 400 Q 280 412 300 400 Q 280 388 248 400" stroke-width="0.7"/>
        <path d="M352 400 Q 320 412 300 400 Q 320 388 352 400" stroke-width="0.7"/>
    </g>

    <!-- Pendentifs haut et bas du médaillon -->
    <g fill="none" stroke="#b8944d" stroke-width="0.9">
        <path d="M300 210 L318 240 L300 262 L282 240 Z"/>
        <path d="M300 590 L318 560 L300 538 L282 560 Z"/>
        <line x1="300" y1="180" x2="300" y2="210"/>
        <line x1="300" y1="620" x2="300" y2="590"/>
    </g>

    <!-- Mention discrète -->
    <text x="300" y="676" text-anchor="middle" font-family="Georgia, serif"
          font-style="italic" font-size="17" letter-spacing="2" fill="#a08544">
        Photographie à venir
    </text>
</svg>
