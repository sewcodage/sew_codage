<!-- @dsCard height=300 -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&amp;family=Jost:wght@400&amp;display=swap" rel="stylesheet">
<style>
.cover{position:relative;width:960px;height:300px;background:var(--ivory-50);overflow:hidden}
.art{position:absolute;left:480px;top:0}
.ink{fill:var(--ink-900)}
.bag{fill:var(--white)}
.sand{fill:var(--sand-200)}
.gold{fill:var(--gold-400)}
.rule{stroke:var(--gold-400);stroke-width:1}
.sq{rx:var(--radius-none)}
.text{position:absolute;left:48px;bottom:32px;max-width:440px;display:flex;flex-direction:column;gap:12px}
.name{margin:0;font-family:var(--font-display);font-weight:500;font-size:104px;line-height:.95;color:var(--ink-900)}
.tag{margin:0;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--ink-500)}
</style>
<div class="cover">
<!--
blocks: ink-900 slab 128x256 (space-16 x2 by space-16 x4) with a white inset 112x248 = the garment bag with black edging; sand-200 square 192x192 (space-16 x3); gold-400 block 96x48 (space-12 x2 by space-12)
arrangement: one tall slab bleeding off the top edge with two satellites to its right
pattern: editorial row, three gold-400 hairlines crossing the sand block; chosen because the system is serif-led, calm and uses rules instead of shadows
scales: space-12 / space-16 steps, radius-none corners (the brand is square)
-->
<svg class="art" width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
<rect class="ink sq" x="96" y="0" width="128" height="256"/>
<rect class="bag sq" x="104" y="0" width="112" height="248"/>
<rect class="sand sq" x="256" y="48" width="192" height="192"/>
<rect class="gold sq" x="256" y="240" width="96" height="48"/>
<line class="rule" x1="232" y1="96" x2="480" y2="96"/>
<line class="rule" x1="232" y1="144" x2="480" y2="144"/>
<line class="rule" x1="232" y1="192" x2="480" y2="192"/>
</svg>
<div class="text">
<h1 class="name">Housses<br>Abaya</h1>
<p class="tag">Le rangement pensé pour la garde-robe du Golfe.</p>
</div>
</div>
